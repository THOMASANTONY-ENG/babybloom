{% extends 'base.html' %}
{% block content %}

<h2>Add Baby</h2>

<div class="card">


<form method="POST">
    {% csrf_token %}
    
    <input type="text" name="name" placeholder="Baby Name" required><br>
    <input type="date" name="dob" required><br>
    
    <select name="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
    </select><br>

    <input type="number" step="0.1" name="weight" placeholder="Weight"><br>
    <input type="number" step="0.1" name="height" placeholder="Height"><br>

    <button type="submit">Add Baby</button>
</form>

</div>

{% endblock %}
