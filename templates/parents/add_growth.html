{% extends 'base.html' %}
{% block content %}

<h2>Add Growth Record for {{ baby.name }}</h2>

<div class="card">


<form method="POST">
    {% csrf_token %}

    <input type="number" step="0.1" name="weight" placeholder="Weight" required><br>
    <input type="number" step="0.1" name="height" placeholder="Height" required><br>

    <button>Add Record</button>
</form>

</div>

{% endblock %}
